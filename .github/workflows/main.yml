name: Main

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+.rc[0-9]+'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    uses: adya/pack-skse-mod/.github/workflows/pack.yml@ng
    with:
      MOD_NAME: "NPCs Names Distributor"
